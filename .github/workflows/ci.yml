name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One CI run per ref; superseded runs on the same PR/branch are cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    outputs:
      can-deploy: ${{ steps.deploy-secret.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format (Biome)
        run: npm run lint

      - name: Generate Worker types
        run: npm run types

      - name: Typecheck
        run: npm run check

      - name: Test (vitest, workerd runtime)
        run: npm test

      - name: Bundle dry run
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Check deploy secret is configured
        id: deploy-secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "present=${{ env.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Cloudflare
    needs: quality
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.quality.outputs.can-deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mcp.joshuamarble.io/
    # Never cancel a deploy mid-flight; queue subsequent ones.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy (wrangler)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy smoke test
        run: |
          set -euo pipefail
          ROOT=https://mcp.joshuamarble.io
          FALLBACK=https://mcp-directory.tolvit-llc.workers.dev

          echo "root directory JSON..."
          for _ in $(seq 1 10); do
            body=$(curl -sf "$ROOT/") && break
            sleep 3
          done
          echo "$body" | grep -q '"servers"'

          echo "root directory HTML..."
          curl -sf -H 'Accept: text/html' "$ROOT/" | grep -q '<title>MCP servers'

          echo "health (workers.dev fallback)..."
          curl -sf "$FALLBACK/health" | grep -q '"status":"ok"'

          echo "hosted servers still win their routes over the wildcard..."
          curl -sf "$ROOT/seats-aero/health" | grep -q '"name":"seats-aero-mcp"'
          curl -sf "$ROOT/tripit/health" | grep -q '"name":"tripit-mcp"'

          echo "unclaimed paths 404 with the directory..."
          code=$(curl -s -o /dev/null -w '%{http_code}' "$ROOT/no-such-server")
          test "$code" = "404"

          echo "smoke test passed"
